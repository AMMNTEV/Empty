<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empty — Вход</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f; color: #e0e0e0;
      min-height: 100vh; display: flex; align-items: center;
      justify-content: center; padding: 20px;
    }
    .card {
      background: #1a1a1a; border-radius: 16px; padding: 32px;
      max-width: 400px; width: 100%;
    }
    h1 { font-size: 22px; margin-bottom: 8px; }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 24px; }
    label { display: block; font-size: 13px; color: #aaa; margin-bottom: 6px; }
    input {
      width: 100%; padding: 12px 14px; background: #252525;
      border: 1px solid #333; border-radius: 10px; color: #fff;
      font-size: 15px; margin-bottom: 16px; outline: none;
    }
    input:focus { border-color: #3b82f6; }
    button {
      width: 100%; padding: 13px; background: #3b82f6; border: none;
      border-radius: 10px; color: #fff; font-size: 15px;
      font-weight: 600; cursor: pointer; margin-top: 8px;
    }
    button:hover { background: #2563eb; }
    button:disabled { background: #444; cursor: not-allowed; }
    .error { color: #ef4444; font-size: 13px; margin-top: 12px; }
    .screen { display: none; }
    .screen.active { display: block; }
  </style>
</head>
<body>

  <div class="card screen" id="screen-create">
    <h1>Добро пожаловать</h1>
    <p class="subtitle">Создайте локальную личность. Регистрация не нужна.</p>
    <label>Никнейм</label>
    <input type="text" id="nickname" placeholder="Алиса" maxlength="32">
    <label>Пароль (для шифрования ключей)</label>
    <input type="password" id="password" placeholder="Минимум 6 символов">
    <label>Повторите пароль</label>
    <input type="password" id="password2" placeholder="Ещё раз">
    <button id="createBtn">Создать</button>
    <div class="error" id="createError"></div>
  </div>

  <div class="card screen" id="screen-unlock">
    <h1>С возвращением</h1>
    <p class="subtitle">Введите пароль для разблокировки</p>
    <label>Пароль</label>
    <input type="password" id="unlockPassword" placeholder="Ваш пароль">
    <button id="unlockBtn">Войти</button>
    <div class="error" id="unlockError"></div>
  </div>

  <script type="module" src="index.js"></script>
</body>
</html>
