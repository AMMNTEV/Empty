<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Empty — Messenger</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f5f5f5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Empty">
  <link rel="apple-touch-icon" href="icons/icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon.png">

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: #f0f0f0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f0f0f0;
      color: #1a1a1a;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      letter-spacing: -0.01em;
    }

    /* ============ BACKGROUND ============ */
    #asciiBg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      opacity: 0.3;
    }

    /* ============ TOP BAR ============ */
    .topbar {
      background: rgba(255, 255, 255, 0.85);
      color: #1a1a1a;
      padding: 10px 16px;
      padding-top: calc(10px + env(safe-area-inset-top));
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      border-bottom: 1px solid #e5e5e5;
      position: relative;
      z-index: 2;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .me-name {
      font-weight: 700;
      font-size: 17px;
      color: #1a1a1a;
      letter-spacing: -0.02em;
    }

    .me-name::before {
      content: none;
    }

    .topbar-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .topbar-actions button {
      background: #f5f5f5;
      border: 1px solid #e5e5e5;
      color: #666;
      padding: 7px 14px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      font-weight: 500;
      letter-spacing: -0.01em;
      transition: all 0.15s;
      border-radius: 20px;
    }

    .topbar-actions button:hover {
      background: #1a1a1a;
      color: #fff;
      border-color: #1a1a1a;
    }

    .topbar-actions button.primary {
      color: #fff;
      background: #1a1a1a;
      border-color: #1a1a1a;
    }

    .topbar-actions button.primary:hover {
      opacity: 0.85;
    }

    /* ============ MAIN ============ */
    .main {
      flex: 1;
      display: flex;
      min-height: 0;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    /* ============ SIDEBAR ============ */
    .sidebar {
      width: 320px;
      background: rgba(255, 255, 255, 0.7);
      border-right: 1px solid #e5e5e5;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      min-height: 0;
      overflow: hidden;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .sidebar-header {
      padding: 16px 16px 10px;
      background: transparent;
      border-bottom: none;
      font-weight: 700;
      color: #1a1a1a;
      flex-shrink: 0;
      letter-spacing: -0.02em;
      font-size: 22px;
    }

    .sidebar-header::before,
    .sidebar-header::after {
      content: none;
    }

    .contacts-list {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0 8px;
    }

    .contact {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-bottom: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 2px;
    }

    .contact:hover {
      background: rgba(0, 0, 0, 0.04);
    }

    .contact.active {
      background: #1a1a1a;
      border-left: none;
      padding-left: 12px;
    }

    .contact.active .contact-name {
      color: #fff;
    }

    .contact.active .contact-fp {
      color: rgba(255, 255, 255, 0.6);
    }

    .contact.active .avatar {
      background: rgba(255, 255, 255, 0.15);
      border-color: transparent;
      color: #fff;
    }

    .avatar {
      width: 46px;
      height: 46px;
      background: #e5e5e5;
      border: none;
      border-radius: 50%;
      color: #666;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      flex-shrink: 0;
      font-size: 16px;
    }

    .contact-info {
      flex: 1;
      min-width: 0;
    }

    .contact-name {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #1a1a1a;
      font-size: 15px;
      letter-spacing: -0.01em;
    }

    .contact-fp {
      font-size: 12px;
      color: #999;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .empty-sidebar {
      padding: 40px 16px;
      color: #aaa;
      text-align: center;
      font-size: 13px;
    }

    /* ============ CHAT AREA ============ */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: rgba(245, 245, 245, 0.5);
    }

    .chat-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aaa;
      padding: 20px;
      text-align: center;
      font-size: 14px;
    }

    .chat-header {
      background: rgba(255, 255, 255, 0.85);
      border-bottom: 1px solid #e5e5e5;
      padding: 10px 16px;
      display: none;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .chat-header.active {
      display: flex;
    }

    .chat-header-info {
      flex: 1;
      min-width: 0;
    }

    .chat-title {
      font-weight: 700;
      font-size: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #1a1a1a;
      letter-spacing: -0.02em;
    }

    .chat-timer {
      font-size: 12px;
      color: #999;
      margin-top: 1px;
    }

    .btn-end-chat {
      background: #fff5f5;
      color: #e53e3e;
      border: 1px solid #fed7d7;
      padding: 7px 14px;
      cursor: pointer;
      white-space:
